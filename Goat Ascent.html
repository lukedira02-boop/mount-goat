<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goat Ascent</title>
<style>
:root{--bg:#dfe6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;border-radius:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=640;
let K=2;
function fit(){const s=Math.min(document.body.clientWidth/W,document.body.clientHeight/H),d=window.devicePixelRatio||1;c.style.width=W*s+'px';c.style.height=H*s+'px';K=Math.min(3,Math.max(1.5,s*d));c.width=Math.round(W*K);c.height=Math.round(H*K);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high'}
addEventListener('resize',fit);fit();
let best=0;try{best=+localStorage.getItem('goatBest')||0}catch(e){}
let st='start',g,P,topY,wolfY,cam,score,t=0,shake=0,buf=0,bd=1,deadAt=0;

function spawn(){
  const l=P[P.length-1],h=-topY,w=Math.max(54,120-h/50)*(.75+Math.random()*.5),gap=65+Math.random()*40,lc=l.x+l.w/2;
  let px=lc+(Math.random()*2-1)*150-w/2;px=Math.max(12,Math.min(W-12-w,px));
  const r=Math.random();topY=l.y-gap;
  P.push({x:px,y:topY,w,t:h>400&&r<.2?1:(h>800&&r>.85?2:0)});
}
function reset(){
  P=[{x:100,y:0,w:160,t:0}];topY=0;
  g={x:180,y:0,vx:0,vy:0,on:P[0],face:1,coy:0};
  while(topY>-900)spawn();
  wolfY=260;cam=-400;score=0;buf=0;shake=0;
}
function doJump(d){g.vy=-620;g.vx=d*270;g.face=d;g.on=null;g.coy=0;buf=0}
function jump(d){
  if(st!=='play'){
    if(performance.now()-deadAt<450)return;
    if(st==='over')reset();
    st='play';doJump(d);return;
  }
  if(g.on||g.coy>0)doJump(d);else{buf=.12;bd=d}
}
function die(){
  st='over';deadAt=performance.now();shake=.4;
  if(score>best){best=score;try{localStorage.setItem('goatBest',best)}catch(e){}}
}
function upd(dt){
  t+=dt;buf-=dt;if(g.coy>0)g.coy-=dt;
  for(const p of P)if(p.fall>0){p.fall-=dt;if(p.fall<=0){p.dead=true;if(g.on===p){g.on=null;g.coy=0}}}
  if(g.on){
    const p=g.on;g.x+=g.vx*dt;
    if(p.t===2)g.vx*=1-dt*.9;else g.vx=0;
    if(g.x<14||g.x>W-14){g.x=Math.max(14,Math.min(W-14,g.x));g.vx=0}
    if(g.x+8<p.x||g.x-8>p.x+p.w){g.on=null;g.coy=.08}
  }else{
    const py=g.y;g.vy+=1500*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;
    if(g.x<14){g.x=14;g.vx=Math.abs(g.vx)}
    if(g.x>W-14){g.x=W-14;g.vx=-Math.abs(g.vx)}
    if(g.vy>0)for(const p of P){
      if(!p.dead&&py<=p.y+1&&g.y>=p.y&&g.x+8>p.x&&g.x-8<p.x+p.w){
        g.y=p.y;g.vy=0;g.on=p;g.vx=p.t===2?g.vx*.8:0;
        if(p.t===1&&!p.fall)p.fall=.55;
        if(buf>0)doJump(bd);
        break;
      }
    }
  }
  const tg=g.y-400;if(tg<cam)cam+=(tg-cam)*Math.min(1,dt*7);
  score=Math.max(score,Math.floor(-g.y/10));
  while(topY>cam-80)spawn();
  while(P.length&&P[0].y>cam+H+300)P.shift();
  wolfY-=(44+Math.min(score*.2,45))*dt*(wolfY-g.y>520?.5:1);
  if(g.y>wolfY-34)die();
}
function drawGoat(){
  const air=!g.on,lh=air?6:10;
  x.save();x.translate(g.x,g.y-cam);x.scale(g.face,1);
  const body=x.createLinearGradient(-8,-lh-18,10,-lh-3);body.addColorStop(0,'#fffdf5');body.addColorStop(.55,'#e7e0d1');body.addColorStop(1,'#b7ad9d');
  // Small ground shadow and softly shaded legs
  if(!air){x.fillStyle='rgba(12,18,23,.24)';x.beginPath();x.ellipse(0,1,15,3,0,0,Math.PI*2);x.fill()}
  for(const lx of[-12,-7,3,8]){
    const leg=x.createLinearGradient(lx,-lh,lx+4,-lh);leg.addColorStop(0,'#d7d0c2');leg.addColorStop(1,'#8e8679');
    x.fillStyle=leg;x.beginPath();x.roundRect(lx,-lh,3.5,lh,1.5);x.fill();
    x.fillStyle='#383632';x.beginPath();x.roundRect(lx-.5,-2,4.5,3,1);x.fill();
  }
  x.fillStyle=body;x.beginPath();x.ellipse(0,-lh-8,15,8,0,0,Math.PI*2);x.fill();
  x.fillStyle='rgba(255,255,255,.58)';x.beginPath();x.ellipse(-3,-lh-12,8,2.4,-.12,Math.PI,Math.PI*2);x.fill();
  // Neck, head, muzzle and beard
  x.fillStyle='#e8e2d6';x.beginPath();x.ellipse(10,-lh-17,5.2,10,-.2,0,Math.PI*2);x.fill();
  x.fillStyle=body;x.beginPath();x.arc(14,-lh-22,7,0,Math.PI*2);x.fill();
  x.fillStyle='#d2c9b9';x.beginPath();x.ellipse(18,-lh-19,4.5,3,-.25,0,Math.PI*2);x.fill();
  x.fillStyle='#eee8dc';x.beginPath();x.moveTo(12,-lh-16);x.lineTo(14,-lh-10);x.lineTo(17,-lh-17);x.fill();
  x.fillStyle='#9a6b61';x.beginPath();x.ellipse(21,-lh-19,1.5,.9,0,0,Math.PI*2);x.fill();
  // Curved horn with a highlight
  x.strokeStyle='#79634a';x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(12,-lh-27);x.bezierCurveTo(10,-lh-34,5,-lh-38,1,-lh-35);x.stroke();
  x.strokeStyle='#c7ad84';x.lineWidth=1;x.beginPath();x.moveTo(11,-lh-28);x.quadraticCurveTo(8,-lh-34,4,-lh-35);x.stroke();
  x.fillStyle='#d5cbbb';x.beginPath();x.moveTo(16,-lh-27);x.lineTo(20,-lh-31);x.lineTo(20,-lh-24);x.closePath();x.fill();
  x.fillStyle='#252629';x.beginPath();x.ellipse(16,-lh-23,1.1,1.5,0,0,Math.PI*2);x.fill();
  x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.arc(16.4,-lh-23.5,.45,0,Math.PI*2);x.fill();
  x.restore();
}
function draw(){
  x.save();x.setTransform(K,0,0,K,0,0);
  if(shake>0)x.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#24405f');gr.addColorStop(1,'#e9a77c');
  x.fillStyle=gr;x.fillRect(-10,-10,W+20,H+20);
  const al=Math.min(1,score/400);x.fillStyle='rgba(255,255,255,'+(.15+al*.7)+')';
  for(let i=0;i<40;i++){const sx=(i*97)%W,sy=((i*61-cam*.03)%(H*.7)+H*.7)%(H*.7);x.fillRect(sx,sy,i%3?1:1.6,i%3?1:1.6)}
  const sg=x.createRadialGradient(270,150,0,270,150,150);sg.addColorStop(0,'rgba(255,220,170,.55)');sg.addColorStop(1,'rgba(255,220,170,0)');x.fillStyle=sg;x.fillRect(0,0,W,H);
  for(let l=0;l<2;l++){
    x.fillStyle=l?'rgba(28,44,66,.5)':'rgba(60,84,112,.45)';
    const b=470+l*70-(cam+400)*(l?.16:.08);
    x.beginPath();x.moveTo(-40,b+400);
    for(let i=0;i<=5;i++)x.lineTo(i*90-40+l*45,b-(i%2?50:110)+l*20);
    x.lineTo(W+60,b+400);x.fill();
  }
  // Fractured cliff walls frame the climbing route
  const rock=x.createLinearGradient(0,0,W,0);rock.addColorStop(0,'#34343a');rock.addColorStop(.025,'#55545a');rock.addColorStop(.06,'rgba(68,67,73,.72)');rock.addColorStop(.94,'rgba(68,67,73,.72)');rock.addColorStop(.975,'#55545a');rock.addColorStop(1,'#34343a');
  x.fillStyle=rock;x.fillRect(0,0,W,H);
  for(let side=0;side<2;side++)for(let i=0;i<13;i++){
    const yy=((i*67-cam*.82+side*29)%(H+100)+H+100)%(H+100)-50;
    const xx=side?W-12-(i%3)*5:12+(i%3)*5;
    x.fillStyle=i%2?'rgba(20,22,27,.34)':'rgba(194,174,152,.16)';x.beginPath();
    x.moveTo(xx,yy);x.lineTo(xx+(side?-1:1)*(5+i%4),yy+9+i%8);x.lineTo(xx+(side?1:-1)*2,yy+16+i%9);x.closePath();x.fill();
  }
  for(const p of P){
    if(p.dead)continue;const sy=p.y-cam;if(sy<-20||sy>H+20)continue;
    const sh=p.fall>0?Math.sin(t*60)*1.5:0;
    const cl=p.t===1?['#b8946a','#7d6040']:p.t===2?['#a6e0f5','#5aa6c6']:['#857c74','#554e49'],pg=x.createLinearGradient(0,sy,0,sy+16);pg.addColorStop(0,cl[0]);pg.addColorStop(1,cl[1]);x.fillStyle=pg;
    x.beginPath();x.roundRect(p.x+sh,sy,p.w,16,5);x.fill();
    x.fillStyle=p.t===2?'#e3f6ff':'#f4f8fb';
    x.beginPath();x.roundRect(p.x+sh,sy,p.w,5,3);x.fill();
    x.fillStyle=p.t===2?'rgba(255,255,255,.68)':'rgba(255,255,255,.12)';x.fillRect(p.x+sh+8,sy+7,Math.max(8,p.w*.22),1.5);
    x.fillStyle='rgba(24,22,20,.23)';for(let i=0;i<Math.floor(p.w/24);i++){const rx=p.x+sh+14+i*24;x.beginPath();x.arc(rx,sy+11+(i%2)*2,1.3,0,Math.PI*2);x.fill()}
    if(p.t===1){x.strokeStyle='#5a432c';x.lineWidth=1.5;x.beginPath();
      x.moveTo(p.x+p.w*.3,sy+5);x.lineTo(p.x+p.w*.4,sy+15);x.moveTo(p.x+p.w*.7,sy+5);x.lineTo(p.x+p.w*.6,sy+15);x.stroke()}
  }
  drawGoat();
  const wy=wolfY-cam;
  if(wy<H+60){
    const wg=x.createLinearGradient(0,wy,0,wy+140);wg.addColorStop(0,'#242a33');wg.addColorStop(1,'#080a0d');x.fillStyle=wg;x.fillRect(0,wy,W,H-wy+60);
    for(let i=0;i<5;i++){
      const hx=30+i*75,hy=wy-4-Math.abs(Math.sin(t*5+i*1.7))*10;
      const fur=x.createLinearGradient(hx-14,hy-20,hx+14,hy+9);fur.addColorStop(0,'#4b515b');fur.addColorStop(.5,'#292e37');fur.addColorStop(1,'#15191f');
      x.fillStyle=fur;x.beginPath();
      x.moveTo(hx-17,hy+10);x.lineTo(hx-15,hy-13);x.lineTo(hx-12,hy-23);x.lineTo(hx-3,hy-12);x.quadraticCurveTo(hx,hy-16,hx+3,hy-12);x.lineTo(hx+13,hy-23);x.lineTo(hx+16,hy-5);x.lineTo(hx+20,hy+8);x.quadraticCurveTo(hx,hy+15,hx-17,hy+10);x.fill();
      x.fillStyle='#4b525c';x.beginPath();x.ellipse(hx,hy-3,12,8,0,0,Math.PI*2);x.fill();
      x.fillStyle='#171b21';x.beginPath();x.moveTo(hx+3,hy-2);x.lineTo(hx+18,hy+3);x.lineTo(hx+4,hy+8);x.closePath();x.fill();
      x.fillStyle='#dce9f4';x.beginPath();x.moveTo(hx+8,hy+5);x.lineTo(hx+11,hy+12);x.lineTo(hx+13,hy+6);x.moveTo(hx+15,hy+4);x.lineTo(hx+18,hy+10);x.lineTo(hx+19,hy+4);x.fill();
      x.fillStyle='#ffbf55';x.beginPath();x.ellipse(hx-7,hy-6,2.4,1.7,-.2,0,Math.PI*2);x.ellipse(hx+2,hy-6,2.4,1.7,-.2,0,Math.PI*2);x.fill();
      x.fillStyle='#202127';x.fillRect(hx-7,hy-7,1,2);x.fillRect(hx+2,hy-7,1,2);
    }
  }
  x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=4;
  x.font='700 22px system-ui,sans-serif';x.textAlign='left';x.fillText(score+' m',16,34);
  x.font='600 13px system-ui,sans-serif';x.textAlign='right';x.fillText('best '+best+' m',W-16,32);
  x.shadowBlur=0;
  if(st!=='play'){
    x.fillStyle='rgba(10,16,24,.62)';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.textAlign='center';
    x.font='800 40px system-ui,sans-serif';
    if(st==='start'){
      x.fillText('Goat Ascent',W/2,250);
      x.font='500 16px system-ui,sans-serif';
      x.fillText('Tap the left or right side to leap that way.',W/2,292);
      x.fillText('Climb fast. The wolves are coming up.',W/2,318);
      x.fillText('Crumbling ledges break; icy ones slide.',W/2,344);
      x.font='700 18px system-ui,sans-serif';x.fillText('Tap to start',W/2,400);
    }else{
      x.fillText('Caught!',W/2,250);
      x.font='700 24px system-ui,sans-serif';x.fillText(score+' m',W/2,296);
      x.font='500 16px system-ui,sans-serif';x.fillText('Best: '+best+' m',W/2,324);
      x.font='700 18px system-ui,sans-serif';x.fillText('Tap to retry',W/2,380);
    }
  }
  x.restore();
}
c.addEventListener('pointerdown',e=>{e.preventDefault();const r=c.getBoundingClientRect();jump(e.clientX-r.left<r.width/2?-1:1)});
addEventListener('keydown',e=>{
  const k=e.key;if(['ArrowLeft','a','A'].includes(k))jump(-1);
  else if(['ArrowRight','d','D'].includes(k))jump(1);
  else if(k===' ')jump(g.face);
});
reset();
let last=performance.now();
(function loop(n){
  const dt=Math.min(.033,(n-last)/1000);last=n;
  if(st==='play')upd(dt);else t+=dt;
  if(shake>0)shake-=dt;
  draw();requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
